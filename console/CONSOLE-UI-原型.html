<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SDP Console · UI 原型</title>
<!--
  结构契约核对（本原型须体现的硬性设计决策）：
  1) 左栏"精简 + 有界"：**恒 5 项** —— 总览 / 服务树 / 运行中心 / 用户与权限 / 接入管理（K8s 集群 + 主机 + 凭据的统一注册表）。
     不放 Org→Service→Component 全量树，也不放任何随资源增长的列表（如"最近访问"）；
     跨组件浏览统一收在"运行中心"的两个视图(运行/发布)内；运行实例以「流水线名称」为主标识、附「流水线ID(uuid)」，点名称看该流水线运行详情  ✔
  2) 全局搜索：顶栏搜索 = 任意资源直达主路径(服务端 GET /search?q=)，替代"树里找"  ✔
  3) 服务树独立页(/catalog)：懒加载(展开才请求子层) + 服务端搜索 + 虚拟滚动(≥200 节点) + master-detail；
     新建/删除为"功能型"(非示意)：根级「＋ 新建 Org」+ 节点 hover「＋」真落库(org→service→component)；
     删除不走树内联图标，统一在右侧详情面板(输入名称二次确认 + 后端 verdict 真校验，通过才移除)；编辑文案按节点类型(Org/Service/组件)  ✔
  4) 组件详情 Tab：概览/交付/配置/环境/制品/权限/日志（环境独立为顶级 Tab）；交付含子 Tab(流水线/运行/发布)；配置=左侧环境选择+右侧 YAML(导入/导出/编辑/保存)；环境=左侧环境树(叶子带「目标类型·通道」角标)+右侧对接面板(目标类型 targetKind × 接入通道 access)+连接测试；
     删除入口：分组**仅当为空**时在树内「＋」右侧露出「－」删除分组（非空分组无删除入口）；环境删除在右侧详情面板**右上角「删除」**；两者均走强确认 + 后端 verdict；
     环境展示与服务树**同一套树行(.tnode/.tree)**：分组=父节点(chev 折叠 + hover「＋」新建环境)，环境=叶子子节点(状态 dot + 「目标类型·通道」角标)；配置页左侧环境选择复用同一棵树(SSOT)  ✔
  5) 流水线 CRUD：新建入口 + 列表(运行/编辑/删除，列表仅存在于组件详情·交付·流水线) + 编辑器工具条(保存/触发/删除) + 删除强确认(后端 verdict)  ✔
  6) 总览指挥中心：待办(可点) + KPI + 最近运行(全局) + 异常集群条  ✔
  7) 双主题：明/暗切换 + 灰阶开关；状态=图标+文字+色  ✔
  8) 四态演示：组件→交付→流水线 列表可切 空/加载/错误/成功  ✔
  本契约仅用于生成后核对，核对后即弃。
-->
<style>
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FAFAFC; --surface-3:#F1F3F4;
  --text:#1D1D1F; --text-sub:#5F6368;
  --hairline:#E0E0E0; --hairline-2:#F0F0F2;
  --accent:#0066CC; --accent-hover:#0058B0; --accent-soft:#E8F0FE;
  --rail-bg:#FFFFFF; --rail-item:#43474E; --rail-hover:rgba(0,0,0,.045);
  --rail-active-bg:#E8F0FE; --rail-active-fg:#0066CC; --rail-group:#9AA0A6;
  --succ-bg:#E6F4EA; --succ-fg:#1E8E3E;
  --run-bg:#E8F0FE;  --run-fg:#0066CC;
  --fail-bg:#FCE8E6; --fail-fg:#D93025;
  --pend-bg:#F1F3F4; --pend-fg:#5F6368;
  --warn-bg:#FEF7E0; --warn-fg:#B06000;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.04);
  --radius:12px;
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#171A20; --surface-2:#1D2129; --surface-3:#22262E;
  --text:#E6E8EC; --text-sub:#98A0AD;
  --hairline:#262B34; --hairline-2:#20242C;
  --accent:#4DA3FF; --accent-hover:#6FB4FF; --accent-soft:#12304D;
  --rail-bg:#141720; --rail-item:#B6BCC8; --rail-hover:rgba(255,255,255,.06);
  --rail-active-bg:#12304D; --rail-active-fg:#6FB4FF; --rail-group:#6B7280;
  --succ-bg:#12351F; --succ-fg:#5DDC86;
  --run-bg:#12304D;  --run-fg:#6FB4FF;
  --fail-bg:#3A1A17; --fail-fg:#FF7B6E;
  --pend-bg:#24282F; --pend-fg:#98A0AD;
  --warn-bg:#3A2F10; --warn-fg:#F0B429;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
.gray{ filter:grayscale(1); }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;cursor:pointer}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:9px}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.rail{width:268px;flex:0 0 268px;background:var(--rail-bg);border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;transition:width .18s ease;overflow:hidden}
.rail.collapsed{width:64px;flex-basis:64px}
.rail-head{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--hairline-2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.brand-dot{width:20px;height:20px;border-radius:6px;background:var(--accent);flex:0 0 20px}
.collapse{margin-left:auto;border:none;background:none;color:var(--text-sub);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:7px}
.collapse:hover{background:var(--rail-hover)}
.rail-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px}
.rail-foot{flex:0 0 auto;border-top:1px solid var(--hairline-2);padding:10px 12px;display:flex;align-items:center;gap:8px}
.rgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--rail-group);font-weight:600;margin:12px 10px 5px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--rail-item);
  cursor:pointer;font-size:14px;white-space:nowrap;transition:background .13s,color .13s;position:relative}
.nav-item:hover{background:var(--rail-hover)}
.nav-item.active{background:var(--rail-active-bg);color:var(--rail-active-fg);font-weight:600}
.nav-item .ni{width:19px;height:19px;flex:0 0 19px;display:grid;place-items:center}
.nav-item .ni svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail.collapsed .nlabel,.rail.collapsed .rgroup{display:none}
.rail.collapsed .nav-item{justify-content:center;padding:9px 0}

/* tree（仅用于「服务树」页与资源管理页，不再出现于左栏） */
.tree{margin-left:16px;padding-left:8px;border-left:1px dashed var(--hairline)}
.tree.root{margin-left:0;padding-left:0;border-left:none}
.tnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--text);font-size:13px;white-space:nowrap}
.tnode:hover{background:var(--surface-2)}
.tnode.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tnode .chev{width:14px;text-align:center;font-size:10px;color:var(--text-sub);transition:transform .15s}
.tnode .chev.open{transform:rotate(90deg)}
.tnode .dot{width:6px;height:6px;border-radius:50%;background:var(--text-sub);flex:0 0 6px}
.tnode.svc .dot{background:var(--accent)}
.tnode .lazy{font-size:10.5px;color:var(--text-sub);opacity:.75;margin-left:auto;padding-left:8px}
.tnode-actions{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .15s;padding-left:8px}
.tnode:hover .tnode-actions{opacity:1}
.tnode-actions .tbtn{font:inherit;font-size:12px;line-height:1;border:1px solid var(--hairline);background:var(--surface);color:var(--text-sub);border-radius:6px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tnode-actions .tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tnode-actions .tbtn-del:hover{border-color:var(--fail-fg);color:var(--fail-fg)}
/* 树容器：自身滚动 + 虚拟滚动窗口 */
.treepane{max-height:420px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--hairline-2)}
.treepane.tall{max-height:none}
.vhint{font-size:11.5px;color:var(--text-sub);padding:8px 14px;background:var(--surface-2);border-top:1px solid var(--hairline-2);display:flex;align-items:center;gap:7px}
/* 全局搜索结果 */
.hit{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer}
.hit:hover{background:var(--surface-2)}
.hit .hk{font-size:10.5px;color:var(--text-sub);border:1px solid var(--hairline);border-radius:5px;padding:1px 6px;white-space:nowrap}
.hit .hn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .hp{font-size:11.5px;color:var(--text-sub)}
.kbd{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--hairline);border-radius:5px;padding:1px 5px;color:var(--text-sub)}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;gap:14px;padding:0 22px}
.crumb{font-size:13px;color:var(--text-sub);display:flex;align-items:center;gap:7px}
.crumb b{color:var(--text);font-weight:600}
.crumb a{color:var(--text-sub)}
.crumb a:hover{color:var(--accent)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-3);border:1px solid transparent;border-radius:9px;
  padding:7px 12px;color:var(--text-sub);font-size:13px;min-width:210px}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.tbtn{border:1px solid var(--hairline);background:var(--surface);color:var(--text-sub);border-radius:9px;
  padding:7px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.tbtn:hover{background:var(--surface-2);color:var(--text)}
.tbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
/* 右上角账户菜单（头像 + 点击展开下拉） */
.usermenu{position:relative;display:inline-flex;align-items:center}
.avatar-btn{border:none;background:none;cursor:pointer;padding:0;border-radius:50%;display:inline-flex;line-height:0}
.avatar-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.usermenu-drop{position:absolute;top:calc(100% + 12px);right:0;min-width:188px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;z-index:60}
.usermenu-drop[hidden]{display:none}
.um-head{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px}
.um-name{font-size:13.5px;font-weight:600;color:var(--text)}
.um-mail{font-size:11.5px;color:var(--text-sub)}
.um-item{padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--text);cursor:pointer;user-select:none}
.um-item:hover{background:var(--surface-2)}
.um-item.danger{color:var(--fail-fg)}
.um-item.danger:hover{background:var(--fail-bg)}
.um-sep{height:1px;background:var(--hairline);margin:5px 4px}
.content{flex:1;overflow-y:auto;padding:24px 28px 60px}
.wrap{max-width:1280px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.title{font-size:26px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--text-sub);font-size:13px;margin-top:4px}
.h2{font-size:16px;font-weight:650;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.h2 .spacer{flex:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:9px;font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .14s,border-color .14s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--hairline)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2)}
.btn-danger{background:var(--surface);color:var(--fail-fg);border:1px solid var(--hairline)}
.btn-danger:hover:not(:disabled){border-color:var(--fail-fg)}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.link{color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge .g{font-size:11px}
.b-succ{background:var(--succ-bg);color:var(--succ-fg)}
.b-run{background:var(--run-bg);color:var(--run-fg)}
.b-fail{background:var(--fail-bg);color:var(--fail-fg)}
.b-pend{background:var(--pend-bg);color:var(--pend-fg)}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip{display:inline-block;background:var(--surface-3);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--text-sub);font-family:"SF Mono",ui-monospace,Menlo,monospace}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{text-align:left;font-size:12px;color:var(--text-sub);font-weight:600;padding:11px 15px;border-bottom:1px solid var(--hairline-2);white-space:nowrap}
.table td{padding:11px 15px;border-bottom:1px solid var(--hairline-2);vertical-align:middle}
.table tbody tr:last-child td{border-bottom:none}
.table tbody tr:hover{background:var(--surface-2)}
.table tr.click{cursor:pointer}
.empty{padding:46px 0;text-align:center;color:var(--text-sub);font-size:13px}
.empty .big{font-size:30px;opacity:.5;display:block;margin-bottom:8px}
.loading{padding:34px 0;text-align:center;color:var(--text-sub);font-size:13px}
.spinner{width:22px;height:22px;border:2.5px solid var(--hairline);border-top-color:var(--accent);border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{background:var(--fail-bg);color:var(--fail-fg);border-radius:10px;padding:11px 15px;font-size:13px;display:flex;gap:9px;align-items:center}
.infobar{border:1px solid var(--hairline);border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.75}
.infobar-h{font-weight:650;margin-bottom:5px}
.infobar-b b{color:var(--text)}
.infobar-b .mono{font-size:11.5px}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 15px;font-size:13px;display:flex;gap:9px;align-items:center;margin-bottom:16px}

/* console-state switcher */
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--text-sub);padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

/* kpi / todo */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi .label{font-size:12.5px;color:var(--text-sub)}
.kpi .num{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .num.good{color:var(--succ-fg)} .kpi .num.bad{color:var(--fail-fg)}
.todos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.todo{display:flex;align-items:center;gap:13px;cursor:pointer;transition:border-color .14s,transform .14s}
.todo:hover{border-color:var(--accent)}
.todo .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 40px}
.todo .n{font-size:26px;font-weight:700;line-height:1}
.todo .t{font-size:13px;font-weight:600} .todo .d{font-size:12px;color:var(--text-sub)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin:16px 0 0}
.tab{padding:11px 15px;font-size:14px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:650}
.tab .caret{font-size:9px;opacity:.7}
.pills{display:flex;gap:7px;margin:16px 0 14px}
.pill{padding:5px 13px;border-radius:999px;font-size:13px;color:var(--text-sub);cursor:pointer;border:1px solid transparent}
.pill:hover{background:var(--surface-2)}
.pill.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* pipeline editor */
.flow{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:6px 2px 14px}
.stage{flex:0 0 264px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:12px;margin-right:30px;position:relative;box-shadow:var(--shadow)}
.stage:last-child{margin-right:0}
.stage::after{content:"→";position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--text-sub);font-size:17px}
.stage:last-child::after{display:none}
.stage-head{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-weight:650;font-size:13.5px;margin-bottom:10px}
.stage-no{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.task{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--hairline-2);border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:13px;cursor:pointer}
.task:hover{border-color:var(--accent)}
.task .ti{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex:0 0 22px;background:var(--surface-3)}
.task .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .tacts{display:none;gap:4px}
.task:hover .tacts{display:flex}
.add-task{width:100%;border:1px dashed var(--hairline);background:none;color:var(--text-sub);border-radius:9px;padding:7px;font-size:12.5px;cursor:pointer;font-family:inherit}
.add-task:hover{border-color:var(--accent);color:var(--accent)}
/* 编排页：阶段头（名称可编辑 + 前移/后移/删除/并行↔串行） */
.stage-name-input{border:1px solid var(--hairline);background:var(--surface-2);border-radius:6px;padding:2px 6px;font:inherit;font-weight:650;font-size:13px;width:90px;color:var(--text);min-width:0}
.stage-name-input:focus{outline:none;border-color:var(--accent)}
.stage-acts{display:flex;gap:4px;margin-left:auto}
.mini{border:1px solid var(--hairline);background:var(--surface);color:var(--text-sub);border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer;font-family:inherit;line-height:1.4}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.mini.danger:hover{border-color:var(--fail-fg);color:var(--fail-fg)}
.task.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* 保存草稿：写回 PIPELINE_GRAPHS 与内存 PIPELINES（kind/desc/last/ver） */
function savePipelineDraft(){
  const name = S.editorName;
  PIPELINE_GRAPHS[name] = {kind:S.editorKind, desc:S.editorDesc, stages:S.editorStages};
  let p = PIPELINES.find(x=>x.name===name);
  if(!p){ p = {id:'p'+Date.now(), name, comp:S.comp, kind:S.editorKind, ver:0, last:'', synced:false}; PIPELINES.push(p); }
  p.kind = S.editorKind; p.desc = S.editorDesc;
  const now = new Date(), pad = n=>String(n).padStart(2,'0');
  p.last = `${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

function deriveType(t){
  if(t.target || t.rollout) return 'Release';
  if(t.approvers) return 'Approval';
  return 'Build';
}
/* Build/Release/Approval 只是「阶段任务在做什么」的内部派发码（喂 runner），并非用户可选的「类型」分类。

   编辑器只显产品语言描述，不露 Build/Release/Approval 原词；type 仅进入请求体供 runner 派发。 */
function taskNature(t){
  if(t.target || t.rollout) return '发布任务';
  if(t.approvers) return '人工审核阶段';
  return '构建 / 运行任务';

  const p = PIPELINES.find(x=>x.name===S.editorName);

    componentId: curUuid(), name: S.editorName, kind: S.editorKind,

      tasks: st.tasks.map((t,j)=>{

        if(t.args)      o.args = [t.args];
        if(t.timeout)   o.timeoutSeconds = parseInt(t.timeout,10) || undefined;
        return o;

function yamlScalar(v){
  if(typeof v==='number') return String(v);
  if(typeof v==='boolean') return String(v);
  const s = String(v);
  if(s==='' || !/^[A-Za-z0-9_./@-]+$/.test(s)) return JSON.stringify(s);
  return s;
}
function objToYaml(obj, indent){
  indent = indent || '';
  const pad = '  ';
  if(Array.isArray(obj)){
    if(obj.length===0) return indent+'[]\n';
    let out = '';
    for(const item of obj){
      if(item && typeof item==='object' && !Array.isArray(item)){
        const inner = objToYaml(item, indent+pad);
        out += inner.replace(indent+pad, indent+'- ');   // 首行加 "- " 前缀
      } else { out += indent+'- '+yamlScalar(item)+'\n'; }
    }
    return out;
  }
  if(obj && typeof obj==='object'){
    const keys = Object.keys(obj);
    if(keys.length===0) return indent+'{}\n';
    let out = '';
    for(const k of keys){
      const val = obj[k];
      if(val===undefined || val===null) continue;
      if(val && typeof val==='object') out += indent+k+':\n'+objToYaml(val, indent+pad);
      else out += indent+k+': '+yamlScalar(val)+'\n';
    }
    return out;
  }
  return indent+yamlScalar(obj)+'\n';
}
/* 弹出请求体预览（JSON / YAML 切换 + 发送到 hub） */
function openRequestModal(){
  const {method, url, body} = buildPipelineRequest();
  const json = JSON.stringify(body, null, 2);
  const yaml = objToYaml(body);
  const renderBody = (fmt)=> `<pre class="code-block mono">${esc(fmt==='yaml'?yaml:json)}</pre>`;
  openModal(`<h3>流水线请求体</h3>
    <div class="mb">
      <div>编排完成，生成的请求体将发送到 hub 流水线接口：</div>
      <div style="margin-top:8px"><span class="chip">${method}</span> <b class="mono">${url}</b></div>
      <div class="sub" style="margin-top:7px">hub 当前 <span class="mono">POST /pipelines</span> 扁平创建、阶段/任务经 <span class="mono">/pipelines/:id/stages</span> 级联落库；console 侧发出完整 DAG，由 console 展开为多次调用（见设计备注 · 编辑器）。</div>
    </div>
    <div class="seg" id="reqFmt">
      <button class="on" data-req-fmt="json">JSON</button>
      <button data-req-fmt="yaml">YAML</button>
    </div>
    <div id="reqBody">${renderBody('json')}</div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="reqBack">返回列表</button>
      <button class="btn btn-primary" id="reqSend">发送到 hub</button>
    </div>`,
    null
  );
  const m = document.getElementById('modal');
  m.querySelector('#reqFmt').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-req-fmt]'); if(!b) return;
    m.querySelectorAll('#reqFmt button').forEach(x=>x.classList.toggle('on', x===b));
    document.getElementById('reqBody').innerHTML = renderBody(b.dataset.reqFmt);
  });
  m.querySelector('#reqSend').addEventListener('click', ()=>{
    const pp = PIPELINES.find(x=>x.name===S.editorName); if(pp) pp.synced = true;
    toast(`${method} ${url}（原型占位发送）`);
    closeModal();
  });
  m.querySelector('#reqBack').addEventListener('click', ()=>{
    S.compTab='delivery'; S.sub.delivery='pipelines'; closeModal(); go('component');
  });
}

    <td style="text-align:right;white-space:nowrap">${acts}</td></tr>`;

function pipelineHead(withComp){

/* ---- 服务树页专用：懒加载树（展开才渲染/请求下一层） ---- */
function treeHtml(nodes, depth){
  return nodes.map(n=>{
    const hasC = n.children && n.children.length;
    const open = S.open[n.id];
    const isComp = !!n.comp;
    const sub = hasC ? `<div class="tree" ${open?'':'style="display:none"'}>${treeHtml(n.children, depth+1)}</div>` : '';
    const lazy = (hasC && !open) ? `<span class="lazy">${n.children.length} 项 · 点开时加载</span>` : '';
    const acts = `${!isComp?`<button class="tbtn" data-act="add-node" data-target="${n.id}" data-label="${n.label}" title="增加子节点">＋</button>`:''}`;
    return `<div class="tnode ${isComp?'comp':'svc'} ${isComp&&n.label===S.comp?'active':''}" data-node="${n.id}" data-label="${n.label}" data-comp="${isComp?1:0}">
      <span class="chev ${open?'open':''}">${hasC?'▶':''}</span>
      <span class="dot"></span><span class="tlabel">${n.label}</span>${lazy}<span class="tnode-actions">${acts}</span></div>${sub}`;
  }).join('');
}
/* 按 id 查找节点 + 拼出路径（仿 old 的 service_tree 路径展示） */
function findNode(id, nodes, trail){
  nodes = nodes||TREE; trail = trail||[];
  for(const n of nodes){
    const t=[...trail, n.label];
    if(n.id===id) return {node:n, path:t};
    if(n.children){ const r=findNode(id, n.children, t); if(r) return r; }
  }
  return null;
}
function nodePath(id){ const r=findNode(id); return r?r.path.join(' / '):'(未知路径)'; }
/* 组件元信息：等同后端 GET /node 返回的字段，仅用于详情页展示，不参与删除判定 */
const compPipelines = (id)=>PIPELINES.filter(p=>p.comp===id).length;
const compEnvs = (id)=>RELEASES.filter(r=>r.comp===id).length;
/* ===== 后端模拟（服务端权威判定，前端不持有此逻辑） =====
   真实实现位于 hub 的 DeleteServiceTreeById：在事务内级联校验，
   不满足则返回 409 + 结构化原因（逐层向上）。此处仅用前端全局数据模拟"数据库状态"，
   用来演示"前端触发 → 后端判定 → 前端渲染 verdict"的契约。 */
function mockDeleteNode(id){
  const node = findNode(id)?.node;
  if(!node) return {ok:false, reasons:['节点不存在']};
  const reasons=[];
  const collect=(n, prefix)=>{
    prefix = prefix || n.label;
    if(n.comp){
      // 关键修正：组件 id(c1…) 与其 label(comp-web…) 不同，PIPELINES/RELEASES 以 label 关联，
      // 故必须用 n.label 过滤，否则校验永远 0 命中、verdict 恒 ok（原型主打功能失效）。
      const ps=compPipelines(n.label), es=compEnvs(n.label), w=[];
      if(ps>0) w.push(`${ps} 条流水线`);
      if(es>0) w.push(`${es} 个环境`);
      if(w.length) reasons.push(`${prefix}：${w.join('、')}未清理`);
    } else { (n.children||[]).forEach(c=>collect(c, `${prefix} / ${c.label}`)); }
  };
  collect(node);
  return reasons.length ? {ok:false, reasons} : {ok:true};
}
/* 从 TREE 真正移除节点（含顶层 org）；等价于后端 DELETE 成功后前端刷新树。 */
function removeNode(id){
  const ti=TREE.findIndex(n=>n.id===id);
  if(ti>=0){ TREE.splice(ti,1); return true; }
  const dfs=(nodes)=>{
    for(const n of nodes){
      if(n.children){
        const i=n.children.findIndex(c=>c.id===id);
        if(i>=0){ n.children.splice(i,1); return true; }
        if(dfs(n.children)) return true;
      }
    }
    return false;
  };
  return dfs(TREE);
}

/* ============ 组件详情查询层（按组件 uuid 作用域；对齐 old 后端 /api/component/:id/...，:id=组件 uuid） ============
   真实后端以组件 uuid 为主键（CreateComponent 生成 uuid.New().String()），所有子资源查询都按 uuid 作用域：
     GET /api/component/:uuid                              → 组件元信息（概览）
     GET /api/component/:uuid/pipelines                    → 该组件流水线
     GET /api/component/:uuid/environments                → 该组件环境
     GET /api/component/:uuid/parameters/:environment_id  → 某环境参数
     GET /api/component/:uuid/products                     → 该组件制品（old 后端有）
     GET /api/component/:uuid/changes                      → 该组件变更（old 后端有）
   本原型在内存模拟上述查询：入参统一为组件 uuid，内部按 uuid→label 解析后过滤内存数据，
   与后端"查询按 component_id(uuid) 过滤"一致。运行/发布为组件内视图，对应
   GET /runs?componentId=:uuid 与 GET /releases?componentId=:uuid（hub 暂无全局发布端点，见 NOTE）。 */
const COMP_BY_UUID = {};
(function indexComps(ns){ ns.forEach(n=>{ if(n.type==='component'&&n.uuid) COMP_BY_UUID[n.uuid]=n; if(n.children) indexComps(n.children); }); })(TREE);
const compLabel = (uuid)=> (COMP_BY_UUID[uuid]||{}).label || S.comp;
const curUuid = ()=>{ for(const u in COMP_BY_UUID){ if(COMP_BY_UUID[u].label===S.comp) return u; } return null; };
const ComponentAPI = {
  /* GET /api/component/:uuid —— 概览 KPI（最近一次运行 / 活跃环境 / 成员 / 待处理） */
  overview(uuid){
    const lbl = compLabel(uuid);
    const runs = RUNS.filter(r=>(r.pipeline.split(' / ')[0]||'')===lbl);
    const last = runs[0] || null;
    const envs = allEnvs(envModel(lbl));
    const pending = RUNS.filter(r=>(r.pipeline.split(' / ')[0]||'')===lbl && r.phase==='waiting').length;
    return [
      {label:'最近一次运行', value: last?last.id:'—', phase: last?last.phase:null},
      {label:'活跃环境', value: envs.length+' 套', phase: null},
      {label:'成员', value: '6 人', phase: null},
      {label:'待处理', value: pending+' 条审批', phase: pending?'waiting':null},
    ];
  },
  /* GET /api/component/:uuid/pipelines */
  pipelines(uuid){ return PIPELINES.filter(p=>p.comp===compLabel(uuid)); },
  /* GET /runs?componentId=:uuid —— 组件内运行视图 */
  runs(uuid){
    const lbl = compLabel(uuid);
    return RUNS.filter(r=>(r.pipeline.split(' / ')[0]||'')===lbl).map(r=>({
      name:r.pipeline.split(' / ')[1], pid:r.pid, phase:r.phase, at:r.at
    }));
  },
  /* GET /releases?componentId=:uuid —— 组件内发布视图（hub 无全局发布端点，前端聚合兜底） */
  releases(uuid){
    const lbl = compLabel(uuid);
    return RELEASES.filter(r=>r.comp===lbl).map(r=>({env:r.env, step:r.step, health:r.health, phase:r.phase}));
  },
  /* GET /api/component/:uuid/environments */
  environments(uuid){ return allEnvs(envModel(compLabel(uuid))); },
  /* GET /api/component/:uuid/parameters/:environment_id */
  parameter(uuid, envId){ return { componentId:uuid, environmentId:envId, yaml: yamlOf(compLabel(uuid), envId) }; },
  /* GET /components/:componentId/artifacts —— 制品库（按组件 uuid 作用域；下载走签名 URL 直连，删除需 artifact:delete） */
  artifacts(uuid){ return (ARTIFACTS[compLabel(uuid)]||[]).slice(); },
  /* GET /components/:componentId/role-bindings —— 组件级权限（component_role_bindings，四种角色见 §7.9） */
  permissions(uuid){ return (PERMISSION_BINDINGS[compLabel(uuid)]||[]).slice(); },
  /* GET /runs/:id/tasks/:name/log —— 组件级「日志」Tab = 运行日志聚合视图（每运行合并展示） */
  logs(uuid){ return (RUN_LOGS[compLabel(uuid)]||[]).slice(); },
  /* GET /api/component/:uuid/changes —— old 后端有此端点，原型未单列 Tab，保留查询以备扩展 */
  changes(uuid){ return []; },
};

/* ============ 配置（左侧环境选择 + 右侧 YAML 查看/编辑/导入/导出）与环境管理 ============ */
/* 环境数据按组件隔离：ENV[S.comp] 下含 groups（分组）→ envs（环境），及每环境 yaml；组件上下文锁定为当前组件。

   一个环境 = 「部署到哪儿」+「怎么连上去」——两个维度**正交**（2026-09-21 裁定，跨组件口径见 docs/README.md §5.6）：

     ① 目标类型 targetKind
        · k8s  —— K8s 集群：有 namespace / ServiceAccount，任务以 K8s Job 形式执行
        · host —— 主机（物理机 / VM / 裸金属 / 归档机）：**没有** Job / namespace / SA / RBAC，
                  执行底座从"目标里起一个容器"退化成"目标主机上跑一条命令"
     ② 接入通道 access（由目标类型**收窄**，host 只有 ssh 一条）
        · agent      仅 k8s · 平台**零凭据**：集群内 Runner Agent 出站回连 hub，环境只需 targetId + namespace
        · kubeconfig 仅 k8s · **hub 持凭据**：hub 出站直连 kube-apiserver（集群装不了 Agent 时）
        · ssh        仅 host · **hub 持凭据**：hub 出站连 sshd，做制品分发 + 启停 + 远程命令

   **凭据方向是这两类通道的本质差别**：`agent` 通道 hub 零凭据（Runner 从目标侧回连）；`kubeconfig` / `ssh`
   两条直连通道由 **hub 侧出站发起、凭据由 hub 持有**，不经 runner、不下发到目标侧。
   后端契约：docs/hub/DATA-MODEL.md §9.5 / §9.7（非容器目标承载，含破坏性 schema 变更）。
   环境记录只存**引用名**（沿用 `repo_secret_ref` / `secret_ref` 惯例），明文在 hub 侧 Secret；
   敏感字段**单向**：接口只回显 `xxxSet:true` 布尔，永不返回明文，改凭据走「重新设置」。 */
/* 目标注册表（mock）= 「平台管理 → 接入管理」页的数据源：**K8s 集群 + 主机一张表**。
   · mode  = 该目标默认的接入通道（agent 靠心跳，kubeconfig / ssh 靠凭据；凭据只留引用名）
   · refs  = 被多少个环境引用（0 = 可安全下线）
   · role='platform' → 平台底座集群：单机版下平台底座与目标同集群（runner 是接入侧代理，身份与部署形态无关；
                       见 docs/hub/DATA-MODEL.md §9.3） */
const TARGETS = [
  { id:'c1', kind:'k8s',  name:'kind-e2e-01',      vendor:'self-hosted', region:'local',    mode:'agent',      status:'online',  agent:'v0.4.2', hb:'12s 前', refs:3, role:'platform' },
  { id:'c2', kind:'k8s',  name:'kind-e2e-02',      vendor:'self-hosted', region:'local',    mode:'agent',      status:'online',  agent:'v0.4.2', hb:'40s 前', refs:1 },
  { id:'c3', kind:'k8s',  name:'tx-prod-gz',       vendor:'tencent',     region:'gz',       mode:'agent',      status:'offline', agent:'v0.4.1', hb:'6h 前',  refs:0 },
  { id:'c4', kind:'k8s',  name:'ali-test-sh',      vendor:'aliyun',      region:'sh',       mode:'kubeconfig', status:'unknown', agent:'—',      hb:'—',      refs:1 },
  { id:'h1', kind:'host', name:'edge-01.internal', vendor:'—',           region:'shanghai', mode:'ssh',        status:'online',  agent:'—',      hb:'—',      refs:1, addr:'10.20.3.11', user:'deploy' },
  { id:'h2', kind:'host', name:'edge-02.internal', vendor:'—',           region:'shanghai', mode:'ssh',        status:'offline', agent:'—',      hb:'—',      refs:0, addr:'10.20.3.12', user:'deploy' },
];
/* 兼容既有引用（Agent 集群下拉 / kubeconfig 面板块只关心 K8s 目标） */
const K8S_TARGETS = TARGETS.filter(t=>t.kind==='k8s');
const HOSTS    = TARGETS.filter(t=>t.kind==='host');
/* 目标类型（正交维度一）—— 决定"目标能不能跑 K8s 任务" */
const TARGET_KINDS = [
  ['k8s',  'K8s 集群',      '集群形态目标：有 namespace / ServiceAccount，任务以 K8s Job 执行'],
  ['host', '主机（非容器）', '物理机 / VM / 裸金属 / 归档机：无 K8s，执行底座是"目标主机上的一条命令"'],
];
/* 接入通道（正交维度二）—— 按目标类型收窄；host 只有 ssh 一条 */
const CHANNELS = { k8s:['agent','kubeconfig'], host:['ssh'] };
/* 每条通道的"事实卡"：谁发起 / 凭据归谁 / 执行载体 / 工作区 / 隔离边界。
   这张表就是「通道差异如何展示」的正面回答——三者本质差别只有两处：**连接方向**与**凭据归属**。 */
const CHANNEL_INFO = {
  agent:      { label:'平台集群（Agent）', by:'Runner 回连（目标 → 平台）',   cred:'平台不持有（凭据在目标侧）',
                carrier:'目标集群里的 K8s Job',   work:'EmptyDir 卷',        guard:'namespace + SA + RoleBinding' },
  kubeconfig: { label:'外部集群直连',      by:'hub 出站直连 kube-apiserver', cred:'hub 持有（引用名 → hub 侧 Secret）',
                carrier:'目标集群里的 K8s Job',   work:'EmptyDir 卷',        guard:'namespace + SA + RoleBinding' },
  ssh:        { label:'主机（SSH）',       by:'hub 出站直连 sshd',           cred:'hub 持有（引用名 → hub 侧 Secret）',
                carrier:'目标主机上的进程 / 脚本', work:'目标主机临时目录',   guard:'SSH 账号即边界（无 RBAC）' },
};
/* ACC_MODES = [通道, 显示名, 一句话说明]，供既有渲染循环复用 */
const ACC_MODES = ['agent','kubeconfig','ssh'].map(k=>{
  const c = CHANNEL_INFO[k];
  return [k, c.label, c.by + ' · 凭据：' + c.cred];
});
function channelsFor(kind){ return (CHANNELS[kind]||CHANNELS.k8s).map(k=>ACC_MODES.find(x=>x[0]===k)); }
function kindDescOf(kind){ return (TARGET_KINDS.find(x=>x[0]===kind)||TARGET_KINDS[0])[2]; }
/* 凭据库（mock；真实由 hub 侧 Secret 持有，平台 DB 只存引用名）。
   host 字段 = 明文实际存放位置（hub 侧 Secret 名）——凭据页要显式写出这一点，
   否则"只存引用名"会被读成"凭据不在平台"，而直连通道下平台**确实持有**凭据。 */
const KUBE_CREDS = [
  { ref:'cred-k8s-ali-sh',  label:'ali-test-sh 集群 kubeconfig', kind:'kubeconfig', used:1, host:'hub Secret · sdp-cred-k8s-ali-sh',  rotated:'2026-08-12' },
  { ref:'cred-k8s-extra',   label:'备用外部集群 kubeconfig',      kind:'kubeconfig', used:0, host:'hub Secret · sdp-cred-k8s-extra',   rotated:'2026-06-02' },
];
const SSH_CREDS = [
  { ref:'cred-ssh-edge',    label:'边缘节点部署账号（免密密钥）', kind:'ssh-key',      used:1, host:'hub Secret · sdp-cred-ssh-edge',   rotated:'2026-09-01' },
  { ref:'cred-ssh-legacy',  label:'老机房部署账号（密码）',       kind:'ssh-password', used:0, host:'hub Secret · sdp-cred-ssh-legacy', rotated:'2025-12-20' },
];
/* 凭据库统一视图（「目标 → 凭据」页数据源） */
const CREDS = KUBE_CREDS.concat(SSH_CREDS);
const blankKube = ()=>({ source:'ref', credRef:'', server:'', caSet:false, insecure:false, auth:'token', credSet:false, ctx:'', parsed:null, parseErr:'' });
const blankSsh  = ()=>({ sudo:false, targets:[] });
const ENV = {};
function envModel(comp){
  if(!ENV[comp]){
    ENV[comp] = { groups:[
      { name:'类生产', envs:[
        { name:'staging', envType:'test', targetKind:'k8s', access:'agent', targetId:'c1', ns:'platform-eng-web-staging',
          status:'succeeded', lastTest:'12s 前', check:null, kube:blankKube(), ssh:blankSsh() },
        { name:'alpha', envType:'test', targetKind:'k8s', access:'agent', targetId:'c2', ns:'platform-eng-web-alpha',
          status:'succeeded', lastTest:'3m 前', check:null, kube:blankKube(), ssh:blankSsh() },
      ]},
      { name:'生产', envs:[
        { name:'production', envType:'production', targetKind:'k8s', access:'kubeconfig', targetId:'', ns:'platform-eng-web-prod',
          status:'paused', lastTest:'8m 前', check:null, ssh:blankSsh(),
          kube:Object.assign(blankKube(), { credRef:'cred-k8s-ali-sh', server:'https://kube-prod-gz.internal:6443',
            caSet:true, auth:'client-cert', credSet:true, ctx:'prod-gz',
            parsed:{ server:'https://kube-prod-gz.internal:6443', ca:true, insecure:false, auth:'client-cert', ctx:'prod-gz', ns:'platform-eng-web-prod' } }) },
        { name:'edge-shanghai', envType:'test', targetKind:'host', access:'ssh', targetId:'', ns:'',
          status:'unknown', lastTest:'—', check:null, kube:blankKube(),
          ssh:{ sudo:true, targets:[
            { host:'10.20.3.11', port:'22', user:'deploy', authType:'key', secretRef:'cred-ssh-edge', secretSet:true, bastion:'jump.sdp.local:22' },
            { host:'10.20.3.12', port:'22', user:'deploy', authType:'key', secretRef:'cred-ssh-edge', secretSet:true, bastion:'' } ] } },
      ]},
    ], yaml:{} };
  }
  return ENV[comp];
}
function defaultYaml(comp, env){
  return `# ${comp} · ${env}\nreplicaCount: 3\nimage:\n  repository: localhost:5000/toolchain/go\n  tag: "1.22"\nresources:\n  requests:\n    cpu: 100m\n    memory: 128Mi\n  limits:\n    cpu: 500m\n    memory: 256Mi\n`;
}
function yamlOf(comp, env){
  const m = envModel(comp);
  if(!m.yaml[env]) m.yaml[env] = defaultYaml(comp, env);
  return m.yaml[env];
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function allEnvs(m){ const out=[]; m.groups.forEach(g=>g.envs.forEach(e=>out.push(e))); return out; }
function findEnv(m, name){ for(const g of m.groups){ const e=g.envs.find(x=>x.name===name); if(e) return e; } return null; }
/* 环境树渲染（组件详情·环境页 与 配置页左侧共用同一份，SSOT）：
   复用服务树同一套树行样式 .tnode / .tree —— 分组=父节点(chev 折叠 + hover ＋ 新建环境)，
   环境=叶子子节点(状态 dot)。
   删除入口：分组"且仅当为空"时，在 ＋ 右侧露出 － 删除分组(opts.manage 开启，见环境页)；
   环境删除不进树内，走右侧详情面板右上角「删除」。 */
function envTreeRows(m, opts){
  opts = opts || {};
  return m.groups.map(g=>{
    const collapsed = S.collapsedGroups.includes(g.name);
    const empty = !g.envs.length;
    /* 删除分组只在"分组为空"时出现，位于 ＋ 新建环境右侧（非空分组不给删除入口） */
    const delGrp = (opts.manage && empty)
      ? `<button class="tbtn tbtn-del" data-act="del-group" data-name="${g.name}" title="删除分组">－</button>`
      : '';
    const kids = empty
      ? `<div class="tnode tnode-fake"><span class="chev"></span><span class="tlabel">（暂无环境，点上方 ＋ 新建）</span></div>`
      : g.envs.map(e=>`<div class="tnode ${S.envName===e.name?'active':''}" data-act="sel-env" data-name="${e.name}">
          <span class="chev"></span><span class="dot ${e.status||'unknown'}"></span><span class="tlabel">${e.name}</span><span class="chtag" title="目标类型 · 接入通道">${chanTag(e)}</span></div>`).join('');
    const chev = empty
      ? `<span class="chev"></span>`
      : `<span class="chev${collapsed?'':' open'}" data-act="toggle-group" data-name="${g.name}" title="折叠/展开">▶</span>`;
    return `<div class="tnode svc ${S.envGroup===g.name?'active':''}" data-act="sel-group" data-name="${g.name}">
      ${chev}<span class="dot"></span><span class="tlabel">${g.name}</span>
      <span class="tnode-actions"><button class="tbtn" data-act="add-env" data-group="${g.name}" title="新建环境">＋</button>${delGrp}</span></div>
      <div class="tree"${collapsed?' style="display:none"':''}>${kids}</div>`;
  }).join('');
}

/* ============ modal / toast ============ */
function openModal(html, onOk){
  const h=document.getElementById('mhost'), m=document.getElementById('modal');
  m.innerHTML = html; h.classList.add('on');
  h.onclick = (e)=>{ if(e.target===h) closeModal(); };
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  /* 回调返回 false ⇒ 校验未过，保持弹窗打开（返回 undefined = 照旧关闭） */
  const ok = m.querySelector('[data-ok]'); if(ok) ok.onclick = ()=>{ if(onOk && onOk()===false) return; closeModal(); };
}

/* ============ delete pipeline（强确认 → DELETE → 渲染后端 verdict） ============ */
/* 后端模拟（服务端权威判定，前端不持有此逻辑）
   真实实现位于 hub 的 DeletePipeline：在事务内校验该流水线是否仍有进行中 / 待审批的运行，
   有则返回 409 + 结构化原因（前端仅渲染）；历史运行不阻塞删除（仅解除编排关联，日志保留）。 */
function mockDeletePipeline(name){
  const runs = RUNS.filter(r => (r.pipeline.split(' / ')[1]||'') === name);
  if(!runs.length) return {ok:false, reasons:['流水线不存在或已被删除']};
  const active = runs.filter(r => r.phase==='running' || r.phase==='waiting');
  const reasons=[];
  if(active.length) reasons.push(`${active.length} 条运行仍在进行（${active.map(r=>r.phase==='running'?'运行中':'待审批').join('、')}），需先终止后再删除`);
  return reasons.length ? {ok:false, reasons} : {ok:true};
}
function delPipeline(name){
  // 前端只负责触发 + 渲染后端 verdict，不做数据判定（判定的权威在后端 DeletePipeline）。
  openModal(`<h3>删除流水线「${name}」？</h3>
    <div class="mb">点击确认后将提交后端删除。若流水线仍有进行中 / 待审批的运行，后端将拒绝并返回原因（前端仅渲染，不判定）。历史运行不被删除——仅解除编排关联，运行日志保留。</div>
    <div class="field"><label>输入流水线名称以确认</label><input id="dp-name" class="input" placeholder="${name}" /></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" data-ok>确认删除</button></div>`,
    ()=>{
      const el=document.getElementById('dp-name');
      if(el && el.value.trim() && el.value.trim()!==name){ toast('流水线名称不匹配', true); return; }
      // 调后端删除（此处为后端模拟；真实为 DELETE /pipelines/:id，不满足返回 409 + reasons）
      const res=mockDeletePipeline(name);
      if(res.ok){ toast(`已删除流水线「${name}」（历史运行日志保留，示意）`); return; }
      // 后端拒绝：把结构化原因渲染进弹窗（不删除）
      openModal(`<h3>无法删除「${name}」</h3>
        <div class="mb">后端判定：该流水线仍存在未结束的运行，需先终止后再删除。</div>
        <ul class="impact">
          ${res.reasons.map(r=>`<li><span class="v danger">${r}</span></li>`).join('')}
        </ul>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>我知道了</button></div>`, null);
    });
}

function delDetail(id, label){
  // 前端只负责触发 + 渲染后端 verdict，不做数据判定（判定的权威在后端 DeleteServiceTreeById）。
  openModal(`<h3>删除节点「${label}」？</h3>
    <div class="mb">点击确认后将提交后端删除。若节点或其下层仍有未清理的流水线 / 环境 / 子节点，后端将拒绝并返回原因（前端仅渲染，不判定）。</div>
    <div class="field"><label>输入节点名称以确认</label><input id="dd-name" class="input" placeholder="${label}" /></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" data-ok>确认删除</button></div>`,
    ()=>{
      const name=document.getElementById('dd-name');
      if(name && name.value.trim() && name.value.trim()!==label){ toast('节点名称不匹配', true); return; }
      // 调后端删除（此处为后端模拟；真实为 DELETE /services/:id 或 DELETE /components/:id，不满足返回 409 + reasons，见 hub/DELETE-CONTRACT.md）
      const res=mockDeleteNode(id);
      if(res.ok){
        // 后端判定通过 → 真正从 TREE 移除（等价于 DELETE 成功后前端刷新树）
        removeNode(id);
        S.catSel = TREE.length ? TREE[0].id : '';
        toast(`已删除节点「${label}」`);
        render();
        return;
      }
      // 后端拒绝：把结构化原因渲染进弹窗（不删除）
      openModal(`<h3>无法删除「${label}」</h3>
        <div class="mb">后端判定：该节点及其下层仍存在未清理的资源，需<b>逐层向上</b>清理后才能删除。</div>
        <ul class="impact">
          ${res.reasons.map(r=>`<li><span class="v danger">${r}</span></li>`).join('')}
        </ul>
        <div class="mb" style="color:var(--text-sub)">清理顺序：组件 → 流水线 / 环境 → 服务 → 组件 … → Org</div>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>我知道了</button></div>`, null);
    });
}
/* ============ 环境树：删除分组 / 环境（模式同服务树 delDetail：前端只触发 + 渲染后端 verdict） ============ */
/* 后端模拟：判定权威在后端（DELETE 事务内级联校验），前端仅渲染原因。环境绑定关系以 RELEASES.env 为"被引用"信号。 */
function mockDeleteGroup(comp, name){
  const m=envModel(comp); const g=m.groups.find(x=>x.name===name);
  if(!g) return {ok:false, reasons:['分组不存在']};
  const reasons=[];
  if(g.envs.length>0) reasons.push(`仍有 ${g.envs.length} 个环境未清理：${g.envs.map(e=>e.name).join('、')}`);
  return reasons.length?{ok:false,reasons}:{ok:true};
}
function mockDeleteEnv(comp, name){
  const used=RELEASES.filter(r=>r.comp===comp && r.env===name).length;
  const reasons=[];
  if(used>0) reasons.push(`${used} 条发布仍绑定该环境（需先解除发布）`);
  return reasons.length?{ok:false,reasons}:{ok:true};
}
function delGroup(name){
  openModal(`<h3>删除分组「${name}」？</h3>
    <div class="mb">点击确认后提交后端删除。若分组下仍有环境未清理，后端将拒绝并返回原因（前端仅渲染，不判定）。</div>
    <div class="field"><label>输入分组名称以确认</label><input id="dg-name" class="input" placeholder="${name}" /></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" data-ok>确认删除</button></div>`,
    ()=>{
      const v=document.getElementById('dg-name'); if(v && v.value.trim() && v.value.trim()!==name){ toast('分组名称不匹配', true); return; }
      const res=mockDeleteGroup(S.comp, name);
      if(res.ok){ const m=envModel(S.comp); m.groups=m.groups.filter(x=>x.name!==name);
        if(S.envGroup===name) S.envGroup='';
        if(!findEnv(m,S.envName)){ const f=allEnvs(m); S.envName=f[0]?f[0].name:''; }
        toast(`已删除分组「${name}」（后端已落库，示意）`); return; }
      openModal(`<h3>无法删除分组「${name}」</h3>
        <div class="mb">后端判定：该分组下仍存在未清理的环境，需清理后才能删除。</div>
        <ul class="impact">${res.reasons.map(r=>`<li><span class="v danger">${r}</span></li>`).join('')}</ul>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>我知道了</button></div>`, null);
    });
}
function delEnv(name){
  openModal(`<h3>删除环境「${name}」？</h3>
    <div class="mb">组件 <b>${S.comp}</b> · 点击确认后提交后端删除。若该环境仍被发布绑定，后端将拒绝并返回原因（前端仅渲染，不判定）。</div>
    <div class="field"><label>输入环境名称以确认</label><input id="de-name" class="input" placeholder="${name}" /></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" data-ok>确认删除</button></div>`,
    ()=>{
      const v=document.getElementById('de-name'); if(v && v.value.trim() && v.value.trim()!==name){ toast('环境名称不匹配', true); return; }
      const res=mockDeleteEnv(S.comp, name);
      if(res.ok){ const m=envModel(S.comp); const g=m.groups.find(x=>x.envs.some(e=>e.name===name));
        if(g) g.envs=g.envs.filter(e=>e.name!==name);
        if(m.yaml && m.yaml[name]) delete m.yaml[name];
        if(S.envName===name){ const f=allEnvs(m); S.envName=f[0]?f[0].name:''; }
        toast(`已删除环境「${name}」（后端已落库，示意）`); return; }
      openModal(`<h3>无法删除环境「${name}」</h3>
        <div class="mb">后端判定：该环境仍被以下资源引用，需先解除后才能删除。</div>
        <ul class="impact">${res.reasons.map(r=>`<li><span class="v danger">${r}</span></li>`).join('')}</ul>
        <div class="modal-foot"><button class="btn btn-ghost" data-close>我知道了</button></div>`, null);
    });
}

function openYamlImport(){
  openModal(`<h3>导入 YAML</h3><div class="mb">粘贴 ${S.comp} · ${S.envName} 的 values.yaml 内容：</div>
    <textarea id="imp-yaml" class="yaml-editor mono" style="min-height:240px">${esc(yamlOf(S.comp, S.envName))}</textarea>

    ()=>{ const ta=document.getElementById('imp-yaml'); if(ta) envModel(S.comp).yaml[S.envName]=ta.value; toast('已导入 YAML'); });

function exportYaml(comp, env){
  const text = yamlOf(comp, env);
  const blob = new Blob([text], {type:'text/yaml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${comp}-${env}-values.yaml`;

  toast('已导出 '+a.download);
}

/* 新建环境 = 三步向导（2026-09-21 设计）：
     Step 1 基本信息（名称 / 分组 / 环境类型）→ Step 2 目标与通道（目标类型收窄可选通道）→ Step 3 该通道的最小必填项。
     创建时**不落任何凭据明文**，凭据一律走引用名；细化凭据可创建后在环境详情页补。
   向导自持状态 S.neWiz，直接改写 #modal —— openModal 只支持「点确定即关闭」，容不下多步。 */
function openAddEnv(group){
  S.neWiz = { step:1, group, name:'', envType:'test', targetKind:'k8s', access:'agent',
              targetId:'', ns:'', kubeSource:'ref', credRef:'', kubeconfig:'',
              ssh:{ host:'', port:'22', user:'', authType:'password', secretRef:'' } };
  renderEnvWizard();
}
function renderEnvWizard(){
  const w = S.neWiz; if(!w) return;
  const h = document.getElementById('mhost'), m = document.getElementById('modal');
  m.innerHTML = envWizardHtml(w);
  h.classList.add('on');
  h.onclick = (e)=>{ if(e.target===h){ S.neWiz=null; closeModal(); } };
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ S.neWiz=null; closeModal(); });
  m.querySelectorAll('[data-wizf]').forEach(inp=>{
    inp.oninput = ()=>{ w[inp.dataset.wizf] = inp.type==='checkbox' ? inp.checked : inp.value; };
  });
  m.querySelectorAll('[data-wizs]').forEach(inp=>{
    inp.oninput = ()=>{ w.ssh[inp.dataset.wizs] = inp.type==='checkbox' ? inp.checked : inp.value; };
  });
  m.querySelectorAll('[data-wiz]').forEach(b=> b.onclick = ()=> envWizardAct(b.dataset.wiz, b) );
}
function envWizardAct(a, el){
  const w = S.neWiz; if(!w) return;
  if(a==='cancel'){ S.neWiz=null; closeModal(); return; }
  if(a==='kind'){
    const k = el.dataset.kind;
    if(w.targetKind!==k){
      w.targetKind = k;
      /* 目标类型收窄通道：host 只有 ssh */
      if(!channelsFor(k).some(x=>x[0]===w.access)) w.access = channelsFor(k)[0][0];
    }
    renderEnvWizard(); return;
  }
  if(a==='access'){ w.access = el.dataset.mode; renderEnvWizard(); return; }
  if(a==='kubesrc'){ w.kubeSource = el.dataset.src; renderEnvWizard(); return; }
  if(a==='prev'){ w.step = Math.max(1, w.step-1); renderEnvWizard(); return; }
  if(a==='next'){
    if(w.step===1){
      w.name = (w.name||'').trim();
      if(!w.name){ toast('请填写环境名称', true); return; }
      const g = envModel(S.comp).groups.find(x=>x.name===w.group);
      if(g && g.envs.find(e=>e.name===w.name)){ toast('该分组下已有同名环境', true); return; }
    }
    if(w.step===2 && w.access==='agent' && !w.targetId){
      toast('请选择平台注册目标；未装 Agent 的目标请改走「外部目标直连」', true); return;
    }
    w.step = Math.min(3, w.step+1); renderEnvWizard(); return;
  }
  if(a==='create'){
    /* 最小必填校验（凭据细节允许创建后再补） */
    if(w.access==='agent'){
      if(!w.targetId){ toast('请选择目标', true); return; }
    }
    if(w.access==='kubeconfig'){
      if(w.kubeSource==='ref' && !w.credRef){ toast('请选择 kubeconfig 凭据', true); return; }
      if(w.kubeSource==='paste' && !(w.kubeconfig||'').trim()){ toast('请粘贴 kubeconfig 内容', true); return; }
    }
    if(w.access==='ssh'){
      if(!(w.ssh.host||'').trim()){ toast('请填写主机地址', true); return; }
      if(!(w.ssh.user||'').trim()){ toast('请填写登录用户', true); return; }
    }
    if(w.access!=='ssh' && !(w.ns||'').trim()){ toast('请填写命名空间', true); return; }
    const g = envModel(S.comp).groups.find(x=>x.name===w.group);
    if(!g){ toast('分组不存在', true); return; }
    const e = { name:w.name, envType:w.envType, targetKind:w.targetKind, access:w.access, targetId:'', ns:'',
                status:'unknown', lastTest:'—', check:null, kube:blankKube(), ssh:blankSsh() };
    if(w.access==='agent'){ e.targetId = w.targetId; e.ns = w.ns.trim(); }
    if(w.access==='kubeconfig'){
      e.ns = w.ns.trim(); e.kube.source = w.kubeSource;
      if(w.kubeSource==='ref') e.kube.credRef = w.credRef;
      else { const p = parseKubeconfig(w.kubeconfig); e.kube.parsed = p.ok ? p.info : null; e.kube.parseErr = p.ok ? '' : p.err;
             e.kube.server = p.ok ? p.info.server : ''; e.kube.ctx = p.ok ? p.info.ctx : ''; }
    }
    if(w.access==='ssh'){
      const ref = (w.ssh.secretRef||'').trim();
      e.ssh.targets = [{ host:w.ssh.host.trim(), port:(w.ssh.port||'22'), user:w.ssh.user.trim(),
                         authType:w.ssh.authType, secretRef:ref, secretSet:!!ref, bastion:'' }];
    }
    g.envs.push(e); S.envName = e.name; S.envGroup = w.group; S.neWiz = null; closeModal();
    toast('已创建环境「'+e.name+'」（'+chanTag(e)+'；凭据与连接测试可在详情页继续完善）'); render();
  }
}

/* ================= 环境对接：渲染 / 解析 / 测试（2026-09-21） ================= */

/* 通道角标（环境树叶子）：一眼看出这个环境「目标类型 · 走哪条通道」 */
const KIND_SHORT = { k8s:'K8s', host:'主机' };
const CHAN_SHORT = { agent:'Agent', kubeconfig:'直连', ssh:'SSH' };
function chanTag(e){ return (KIND_SHORT[(e&&e.targetKind)||'k8s']||'K8s') + '·' + (CHAN_SHORT[e&&e.access]||'—'); }
/* 通道说明卡：「谁发起连接 / 凭据归谁 / 执行载体 / 工作区 / 隔离边界」五问一次说清。
   agent 与两条直连通道的本质差别只有"连接方向 + 凭据归属"两处，其余是同构的；
   host 则连执行载体与隔离边界都换了（无 Job、无 RBAC）——这正是它必须单列一条通道的原因。 */
function channelCard(env){
  const c = CHANNEL_INFO[(env&&env.access)||'agent'] || CHANNEL_INFO.agent;
  const rows = [['谁发起连接', c.by], ['凭据归属', c.cred], ['执行载体', c.carrier], ['工作区', c.work], ['隔离边界', c.guard]];
  return `<div class="infobar" style="margin-bottom:14px">
      <div class="infobar-h">通道说明 · <span class="mono">${esc((env||{}).access||'agent')}</span>${env&&env.access==='ssh'?'（主机目标的唯一通道）':''}</div>
      <div class="infobar-b" style="display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin-top:5px">
        ${rows.map(([a,b])=>`<span class="hint">${a}</span><span>${esc(b)}</span>`).join('')}
      </div></div>`;
}
/* 配置完整度：none = 关键字段缺失；set = 已配置（是否验证通过另看 env.status） */
function envConfigState(env){
  if(!env) return 'none';
  if(env.access==='agent') return (env.targetId && env.ns) ? 'set' : 'none';
  if(env.access==='kubeconfig'){
    const k = env.kube || {};
    const has = k.source==='ref'   ? !!k.credRef
              : k.source==='paste' ? !!k.parsed
              : !!(k.server && k.credSet);
    return (has && env.ns) ? 'set' : 'none';
  }
  const s = env.ssh || {};
  return (s.targets && s.targets.length && s.targets.every(t=>t.secretSet)) ? 'set' : 'none';
}
/* 环境状态徽章 = 配置完整度 × 最近一次测试结果 */
function envStatusBadge(env){
  const st = env && env.status;
  if(st==='succeeded') return '<span class="badge b-succ">验证通过</span>';
  if(st==='paused')    return '<span class="badge b-warn">验证失败</span>';
  return envConfigState(env)==='none'
    ? '<span class="badge b-pend">未配置</span>'
    : '<span class="badge b-pend">已配置 · 未验证</span>';
}

function envAccessBody(env){
  if(env.access==='kubeconfig') return kubeAccessBody(env);
  if(env.access==='ssh')        return sshAccessBody(env);
  return agentAccessBody(env);
}

/* ① 平台集群（Agent 回连）：不需要任何凭据 */
function agentAccessBody(env){
  const list = K8S_TARGETS.filter(c=>c.mode==='agent');
  const opts = list.map(c=>`<option value="${c.id}" ${env.targetId===c.id?'selected':''}>${esc(c.name)} · ${esc(c.vendor)}/${esc(c.region)} · ${c.status==='online'?'在线':'离线'}</option>`).join('');
  const c = K8S_TARGETS.find(x=>x.id===env.targetId);
  return `<div class="env-grid">
      <div class="field"><label>接入目标（GET /api/v1/targets）</label>
        <select class="input" data-env-field="targetId"><option value="">— 请选择 —</option>${opts}</select></div>
      <div class="field"><label>命名空间 namespace</label>
        <input class="input mono" data-env-field="ns" value="${esc(env.ns||'')}" placeholder="{org}-{component}-{env}" /></div>
    </div>
    <div class="infobar"><div class="infobar-h">Agent 回连模式：不需要 kubeconfig，也不需要 kube-apiserver 地址</div>
      <div class="infobar-b">集群内 Runner Agent 主动<b>出站</b>回连 hub${c?`（${esc(c.name)} · 心跳 ${c.hb} · agent ${c.agent}）`:''}，
      平台把 PipelineRunSpec 经已有长连接下发，<b>hub 不持有该集群的任何凭据</b>（仅 <span class="mono">agent</span> 通道如此） —— 这就是 hub <span class="mono">targets</span> 表
      只有 <span class="mono">name/vendor/region/status/heartbeat</span>、没有 kubeconfig 字段的原因。
      目标注册与 Agent 生命周期在「平台管理 → 接入管理」维护。</div></div>`;
}

/* ② 外部集群直连：凭据来源三选一，明文一律不落环境记录 */
function kubeAccessBody(env){
  const k = env.kube || blankKube();
  const seg = `<span class="seg">${[['ref','引用凭据'],['paste','粘贴 kubeconfig'],['manual','手工填写']]
    .map(([s,l])=>`<button class="${k.source===s?'on':''}" data-act="kube-src" data-src="${s}">${l}</button>`).join('')}</span>`;
  const nsField = `<div class="field"><label>命名空间 namespace</label>
        <input class="input mono" data-env-field="ns" value="${esc(env.ns||'')}" placeholder="{org}-{component}-{env}" /></div>`;
  let body = '';
  if(k.source==='ref'){
    const opts = KUBE_CREDS.map(c=>`<option value="${c.ref}" ${k.credRef===c.ref?'selected':''}>${esc(c.label)}（被 ${c.used} 个环境引用）</option>`).join('');
    body = `<div class="env-grid">
        <div class="field"><label>kubeconfig 凭据（凭据库）</label>
          <select class="input" data-env-field="kube.credRef"><option value="">— 请选择 —</option>${opts}</select></div>
        ${nsField}
      </div>`;
  } else if(k.source==='paste'){
    body = `<div class="field"><label>kubeconfig 内容（YAML）</label>
        <textarea class="input" data-kubeconfig data-env-field="kube.raw" placeholder="apiVersion: v1&#10;clusters:&#10;- cluster:&#10;    server: https://kube-apiserver.example.com:6443&#10;    certificate-authority-data: LS0t…">${esc(k.raw||'')}</textarea></div>
      <div class="toolbar2" style="margin-top:2px">
        <button class="btn btn-ghost btn-sm" data-act="kube-parse">解析并回显</button>
        <span class="hint">只做<b>结构预览</b>：解析后明文即被消费，环境记录只留摘要</span></div>
      ${kubeParsedHtml(k)}
      <div class="env-grid" style="margin-top:12px">${nsField}</div>`;
  } else {
    const authOpts = [['token','Bearer Token'],['client-cert','客户端证书'],['basic','用户名 / 密码']]
      .map(([v,l])=>`<option value="${v}" ${k.auth===v?'selected':''}>${l}</option>`).join('');
    let cred = '';
    if(k.auth==='token'){
      cred = k.credSet
        ? `<div class="field"><label>Token</label><div class="row" style="gap:8px"><span class="mask">••••••••••••••••</span><span class="chip">已配置</span><span class="spacer" style="flex:1"></span><button class="link" data-act="kube-reset" data-what="token">重新设置</button></div></div>`
        : `<div class="field"><label>Token</label><input class="input mono" data-env-field="kube.token" placeholder="ServiceAccount Token…" /></div>`;
    } else if(k.auth==='client-cert'){
      cred = `<div class="field"><label>客户端证书 / 私钥（client-certificate-data + client-key-data）</label>
        <div class="row" style="gap:8px"><span class="mask">••••••••••••••••</span><span class="chip">${k.credSet?'已配置':'未配置'}</span><span class="spacer" style="flex:1"></span><button class="link" data-act="kube-reset" data-what="cert">${k.credSet?'重新设置':'去配置'}</button></div></div>`;
    } else {
      cred = `<div class="field"><label>用户名</label><input class="input mono" data-env-field="kube.username" value="${esc(k.username||'')}" /></div>
              <div class="field"><label>密码</label><div class="row" style="gap:8px"><span class="mask">••••••••</span><span class="chip">${k.credSet?'已配置':'未配置'}</span><span class="spacer" style="flex:1"></span><button class="link" data-act="kube-reset" data-what="password">${k.credSet?'重新设置':'去配置'}</button></div></div>`;
    }
    body = `<div class="env-grid">
        <div class="field col2"><label>kube-apiserver 地址（server）</label>
          <input class="input mono" data-env-field="kube.server" value="${esc(k.server||'')}" placeholder="https://kube-apiserver.example.com:6443" /></div>
        <div class="field"><label>认证方式</label>
          <select class="input" data-env-field="kube.auth" data-env-rerender>${authOpts}</select></div>
        <div class="field"><label>默认 context</label>
          <input class="input mono" data-env-field="kube.ctx" value="${esc(k.ctx||'')}" placeholder="可选，如 prod-gz" /></div>
        ${cred}
        ${nsField}
        <div class="field col2" style="margin-top:2px"><label>TLS</label>
          <div class="checks">
            <label><input type="checkbox" data-env-field="kube.caSet" ${k.caSet?'checked':''} /> 已内置 CA 证书（certificate-authority-data）</label>
            <label><input type="checkbox" data-env-field="kube.insecure" ${k.insecure?'checked':''} /> 跳过 TLS 校验（insecure-skip-tls-verify · 仅限测试环境）</label>
          </div></div>
      </div>`;
  }
  return `<div class="toolbar2" style="margin-bottom:10px"><span class="hint">凭据来源：</span>${seg}<div class="spacer"></div><button class="btn btn-ghost btn-sm" data-act="remote-exec" data-kind="kubeconfig">▷ 远程执行（诊断）</button></div>
    ${body}
    <div class="infobar" style="margin-top:12px"><div class="infobar-h">凭据不落库明文（沿用既有 secret_ref 惯例）</div>
      <div class="infobar-b">环境记录只保存<b>引用名</b>（<span class="mono">kubeconfigSecretRef</span>），明文由 hub 侧 Secret 持有；<b>hub 出站直连目标时在服务端使用</b>，不下发到目标侧 ——
      与 <span class="mono">components.repo_secret_ref</span> / <span class="mono">component_configs.secret_ref</span> 同一套规则。
      看环境只需 <span class="mono">config:read</span>（只能看到「已配置」），改凭据需 <span class="mono">config:update</span>。</div></div>`;
}

/* kubeconfig 解析结果回显卡 */
function kubeParsedHtml(k){
  if(k && k.parseErr) return `<div class="errbox" style="margin-top:10px">✕ 解析失败：${esc(k.parseErr)}</div>`;
  if(!k || !k.parsed) return '';
  const p = k.parsed;
  const rows = [
    ['kube-apiserver 地址（server）', p.server || '—'],
    ['CA 证书', p.ca ? '已内置（certificate-authority-data）' : '无'],
    ['跳过 TLS 校验', p.insecure ? '是（insecure-skip-tls-verify）' : '否'],
    ['认证方式', ({'token':'Bearer Token','client-cert':'客户端证书','basic':'用户名 / 密码','exec':'exec 插件（平台不支持）'})[p.auth] || p.auth || '—'],
    ['current-context', p.ctx || '—'],
    ['默认命名空间', p.ns || '（kubeconfig 未声明，按环境填写）'],
  ];
  return `<div class="infobar" style="margin-top:10px">
      <div class="infobar-h">已接收 kubeconfig —— 只保留以下结构摘要，明文不留在环境记录里</div>
      <div class="infobar-b" style="display:grid;grid-template-columns:170px 1fr;gap:4px 10px;margin-top:6px">
        ${rows.map(([a,b])=>`<span class="hint">${a}</span><span class="mono">${esc(b)}</span>`).join('')}
      </div></div>`;
}

/* ③ 主机（SSH）：目标主机列表 + 凭据引用 */
function sshAccessBody(env){
  const s = env.ssh || blankSsh();
  const rows = (s.targets||[]).map((t,i)=>`<tr>
      <td class="mono">${esc(t.host)}</td><td class="mono">${esc(t.port||'22')}</td><td class="mono">${esc(t.user)}</td>
      <td>${t.authType==='key'?'免密密钥':'用户名 / 密码'}</td>
      <td>${t.secretSet?`<span class="chip">${esc(t.secretRef||'已配置')}</span>`:'<span class="hint">未配置</span>'}</td>
      <td>${t.bastion?`<span class="mono">${esc(t.bastion)}</span>`:'<span class="hint">直连</span>'}</td>
      <td><button class="link" data-act="ssh-host-edit" data-i="${i}">编辑</button>
          <button class="link" style="color:var(--fail-fg)" data-act="ssh-host-del" data-i="${i}">移除</button></td>
    </tr>`).join('');
  return `<div class="sec" style="margin-top:2px;border-bottom:none;padding-bottom:0">
      <span class="st" style="font-size:12.5px">目标主机</span><span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" data-act="remote-exec" data-kind="ssh">▷ 远程执行（诊断）</button>
      <button class="btn btn-ghost btn-sm" data-act="ssh-host-add">＋ 添加主机</button></div>
    ${ (s.targets||[]).length
      ? `<table class="tbl-sm" style="margin-top:8px">
          <thead><tr><th>主机</th><th>端口</th><th>用户</th><th>认证</th><th>凭据引用</th><th>跳板机</th><th>操作</th></tr></thead>
          <tbody>${rows}</tbody></table>`
      : `<div class="empty" style="padding:26px 0"><span class="big">🖧</span>还没有目标主机
          <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-act="ssh-host-add">＋ 添加主机</button></div></div>` }
    <div class="field" style="margin-top:14px"><label>提权</label>
      <div class="checks"><label><input type="checkbox" data-env-field="ssh.sudo" ${s.sudo?'checked':''} /> 部署时用 sudo 提权（部署账号非 root 时）</label></div></div>
    <div class="infobar"><div class="infobar-h">SSH 凭据同样不落库明文</div>
      <div class="infobar-b">环境只存 <span class="mono">sshSecretRef</span>（hub 侧 Secret 名），密码 / 私钥 / passphrase 都不进 hub 数据库。
      认证支持 <b>用户名 + 密码</b> 与 <b>免密密钥（PEM + 可选 passphrase）</b>；可经 <b>跳板机</b>（ProxyJump）中转。

/* 远程执行（诊断通道）：直连通道下由 hub 侧发起的一次性命令执行。
   与流水线执行的区分：手动、一次一条、逐条审计、不进 DAG（见 docs/console §7.12.8）。 */
function openRemoteExec(kind){
  const e = curEnv(); if(!e) return;
  const t0 = (e.ssh && e.ssh.targets && e.ssh.targets[0]) ? e.ssh.targets[0] : null;
  const target = (kind==='ssh')
    ? (t0 ? (t0.user+'@'+t0.host+':'+(t0.port||'22')) : '（未配置主机）')
    : ((e.kube && e.kube.server) ? e.kube.server : '（未配置 kube-apiserver）');
  const cmd = (kind==='ssh') ? 'systemctl status sdp-agent --no-pager' : 'kubectl -n prod rollout status deploy/web --timeout=30s';
  const out = (kind==='ssh')
    ? '$ systemctl status sdp-agent --no-pager\n● sdp-agent.service - SDP deploy agent\n     Active: active (running) since Mon 2026-09-21 09:12:04 CST\n   Main PID: 1832\n     Memory: 24.1M'
    : '$ kubectl -n prod rollout status deploy/web --timeout=30s\ndeployment "web" successfully rolled out';
  openModal('<h3>远程执行命令（诊断通道）</h3>'+
    '<div class="mb">目标：<b class="mono">'+esc(target)+'</b> · 经 <span class="mono">'+esc(kind)+'</span> 由 <b>hub 侧</b>发起连接（<b>不经 Runner</b>）。</div>'+
    '<div class="field"><label>命令</label><input class="input mono" value="'+esc(cmd)+'" /></div>'+
    '<pre class="code-block">'+esc(out)+'</pre>'+
    '<div class="infobar"><div class="infobar-b">手动诊断通道：一次一条、逐条审计、需 <span class="mono">target:exec</span> 权限；<b>自动化执行请走流水线任务</b>（§7.12.8）。输出仅为示意。</div></div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" data-close>关闭</button></div>');
}

/* kubeconfig 结构解析（原型用轻量行解析；真实实现由 hub 侧 yaml.Unmarshal + clientcmd 做权威校验） */
function parseKubeconfig(text){
  const src = String(text||'');
  if(!src.trim()) return {ok:false, err:'内容为空'};
  const lines = src.split(/\r?\n/);
  const find = (re)=>{ for(const l of lines){ const m=l.match(re); if(m) return m[1].trim(); } return ''; };
  const has  = (re)=> lines.some(l=>re.test(l));
  const server   = find(/^\s*server:\s*(.+)$/);
  const ctx      = find(/^\s*current-context:\s*(.+)$/);
  const ns       = find(/^\s*namespace:\s*(.+)$/);
  const ca       = has(/certificate-authority(-data)?:/);
  const insecure = has(/insecure-skip-tls-verify:\s*true/);
  const useExec  = has(/^\s*exec:/);
  const cert     = has(/client-certificate(-data)?:/);
  const token    = has(/^\s*token:\s*\S/);
  const basic    = has(/^\s*(username|password):\s*\S/);
  if(!has(/^\s*clusters:/)) return {ok:false, err:'不是合法 kubeconfig：缺少 clusters 段'};
  if(!server) return {ok:false, err:'clusters[].cluster.server 缺失，无法定位 kube-apiserver 地址'};
  if(useExec) return {ok:false, err:'认证方式为 exec 插件（本地命令签发证书），平台不支持；请改用静态 Token 或客户端证书'};
  const auth = cert ? 'client-cert' : token ? 'token' : basic ? 'basic' : '';
  if(!auth) return {ok:false, err:'未找到可用认证材料（token / client-certificate-data / username+password 至少其一）'};
  return {ok:true, info:{ server, ca, insecure, auth, ctx, ns }};
}

/* 连接测试：逐项 checklist（原型按配置推导；真实由 hub `POST /environments/:id/test` 逐项探测、各自超时） */
function mockEnvTest(env){
  const items = [];
  const push = (ok,name,detail)=>items.push({ok:!!ok, name, detail});
  if(env.access==='agent'){
    const c = K8S_TARGETS.find(x=>x.id===env.targetId);
    const online = !!(c && c.status==='online');
    push(!!c, '目标已注册', c ? `${c.name} · ${c.vendor}/${c.region}` : '未选择集群');
    push(online, 'Runner Agent 在线', c ? (online ? `心跳 ${c.hb} · agent ${c.agent}` : `心跳 ${c.hb}，离线无法下发`) : '—');
    push(!!env.ns, '命名空间已声明', env.ns || '未填写 namespace');
    push(online && !!env.ns, '部署权限（dry-run create deployment）', online && env.ns ? 'ServiceAccount 具备 create deployments' : '前置项未通过，跳过');
  } else if(env.access==='kubeconfig'){
    const k = env.kube || {};
    const server = k.source==='manual' ? k.server : ((k.parsed && k.parsed.server) || '');
    const caOK   = k.insecure || k.caSet || !!(k.parsed && k.parsed.ca);
    const authOK = k.source==='ref' ? !!k.credRef : k.source==='paste' ? !!k.parsed : !!k.credSet;
    push(!!server, 'kube-apiserver 可达', server ? `TCP/TLS 握手成功 ${server}` : '未提供 server 地址');
    push(!!server && caOK, 'TLS / CA 校验', !server ? '前置项未通过，跳过'
      : k.insecure ? '已跳过校验（insecure-skip-tls-verify）' : caOK ? 'CA 校验通过' : '缺少 CA 且未跳过校验');
    push(authOK, '认证通过', authOK
      ? (k.source==='ref' ? `凭据 ${k.credRef}` : k.source==='paste' ? 'kubeconfig 内置认证材料有效' : 'Token / 证书有效')
      : '未提供认证材料');
    push(!!env.ns, '命名空间可访问', env.ns ? `namespace/${env.ns} 存在` : '未填写 namespace');
    push(!!server && caOK && authOK && !!env.ns, '部署权限（dry-run create/update deployment）',
      server && caOK && authOK && env.ns ? '具备 create/update deployments' : '前置项未通过，跳过');
  } else {
    const t = (env.ssh && env.ssh.targets && env.ssh.targets[0]) || {};
    const up = !!(t.host && t.secretSet);
    push(!!t.host, 'TCP 可达', t.host ? `${t.host}:${t.port||'22'} 握手成功` : '未添加目标主机');
    push(!!t.host, '主机指纹校验（known_hosts）', t.host ? (t.authType==='key' ? '指纹匹配' : '密码模式跳过指纹校验') : '—');
    push(!!t.secretSet, 'SSH 认证通过', t.secretSet
      ? (t.authType==='key' ? '公钥认证成功（私钥来自 Secret）' : '密码认证成功（来自 Secret）') : '未引用凭据');
    push(up, '部署目录可写', up ? `/opt/app 可写（user=${t.user||'—'}）` : '前置项未通过，跳过');
    push(!env.ssh.sudo || up, 'sudo 提权可用', env.ssh.sudo ? (up ? 'sudo -n 免密可用' : '前置项未通过，跳过') : '未启用（无需提权）');
  }
  return items;
}
function envTestHtml(env){
  const c = env.check;
  if(!c) return `<div class="hint">尚未测试。点击「测试连接」逐项校验：网络可达 → TLS / 认证 → 命名空间与部署权限（SSH 则为指纹 / 认证 / 写权限 / sudo）。</div>`;
  const okN = c.items.filter(i=>i.ok).length, total = c.items.length;
  const all = okN===total;
  return `<ul class="chk">${c.items.map(i=>`<li>
      <span class="ic ${i.ok?'ok':'no'}">${i.ok?'✓':'✕'}</span>
      <span>${esc(i.name)}</span>
      <span class="dt">${esc(i.detail)}</span></li>`).join('')}</ul>
    <div class="toolbar2" style="margin-top:10px">
      <span class="badge ${all?'b-succ':'b-warn'}">${okN}/${total} 项通过</span>

    ${ all ? '' : `<div class="errbox" style="margin-top:8px">✕ 存在未通过项 —— 请修正上方配置后重试。</div>` }`;
}

/* data-env-field="a.b.c" 路径写入（环境面板的字段绑定统一走这里） */
function setPath(obj, path, val){
  const ks = String(path||'').split('.');
  let cur = obj;
  for(let i=0;i<ks.length-1;i++){
    if(cur[ks[i]]==null || typeof cur[ks[i]]!=='object') cur[ks[i]] = {};
    cur = cur[ks[i]];
  }
  cur[ks[ks.length-1]] = val;
  return obj;
}

document.getElementById('searchBtn').addEventListener('click', openSearch);
document.addEventListener('keydown', (e)=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
});

document.getElementById('themeBtn').addEventListener('click', ()=>{
  S.theme = S.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme = S.theme; render();
});
document.getElementById('grayBtn').addEventListener('click', ()=>{ S.gray=!S.gray; render(); });
document.getElementById('noteBtn').addEventListener('click', ()=>{ S.notes=!S.notes; render(); });

/* 右上角账户菜单：点击头像展开/收起，点击外部收起 */
document.getElementById('userBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const d=document.getElementById('userDrop');
  d.hidden=!d.hidden;
});
document.getElementById('userDrop').addEventListener('click', (e)=>{
  e.stopPropagation();
  const it=e.target.closest('[data-user-act]');
  if(!it) return;
  document.getElementById('userDrop').hidden=true;
  const act=it.dataset.userAct;
  if(act==='profile') toast('个人中心（原型占位）');
  else if(act==='logout') toast('已退出登录（原型占位）');
});
document.addEventListener('click', ()=>{ const d=document.getElementById('userDrop'); if(d) d.hidden=true; });

/* ============ boot ============ */
(function(){
  const sysDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = sysDark?'dark':'light';
  document.documentElement.dataset.theme = S.theme;
  render();
})();

const ARTIFACTS = {

    {id:'a3', name:'comp-web-staging-1.4.2.tgz', builtAt:'2026-09-14 19:30', size:'12.6 MB', url:'https://artifacts.sdp.local/platform-eng/sounds-great/comp-web/run-8f22/comp-web-staging-1.4.2.tgz?sig=7e0a…b229'},

/* 归档说明：本页只读，仅展示流水线构建 / 发布产物；删除 / 清理由 GC 与过期策略处理，人工不开放。 */
const ARCHIVE_INFO = `<div class="infobar">
  <div class="infobar-h">🗄 归档与备份（本页只读：仅展示流水线构建 / 发布产物，非上传入口）</div>
  <div class="infobar-b">
    <b>存储</b> 对象存储 MinIO（3 副本 · 跨 AZ 同步），bucket <span class="mono">sdp-artifacts</span>，域名 <span class="mono">artifacts.sdp.local</span>；并镜像至 NFS 归档盘 <span class="mono">/data/artifacts/{org}/{component}/{version}/</span>。<br>
    <b>目录</b> <span class="mono">sdp-artifacts/{org}/{service_tree_path}/{component}/{run_id}/{artifact_name}</span><br>
    <b>备份</b> 每日 02:00 增量快照 · 每周日 03:00 全量；热层（可下载）保留 <b>90 天</b> → 转冷归档 <b>1 年</b>（合规留痕）→ GC 报告 + 人工确认后清理。<br>
    <b>过期</b> <span class="mono">expires_at</span> <b>已生效</b>（保留期 GC，<b>默认关闭</b>）：先删对象、后删行；对象删失败的行标记 <span class="mono">pending_deletion</span> 并由下一轮自动重试，且不再出现在制品列表。对账本身仍为「仅报告 + 人工确认」（见 hub DELETE-CONTRACT §6.6-4）。
  </div>
</div>`;

  'comp-web':[
    {subject:'张三', subjectType:'user', role:'component-admin', boundBy:'系统', boundAt:'创建时', owner:true},

};
const COMP_ROLES = [
  {key:'component-viewer', label:'查看者', perms:'只读：概览 / 配置 / 环境 / 制品 / 日志 / 运行'},
  {key:'component-editor', label:'编辑者', perms:'读写 + 触发运行 + 编辑配置 / 环境 / 流水线'},

/* ---------- 制品（artifacts） ---------- */
function pageArtifacts(){
  const uuid=curUuid();
  const all=(ARTIFACTS[compLabel(uuid)]||[]);
  const seg=`<span class="seg">${['success:有效','empty:空态','loading:加载中','error:错误'].map(x=>{const[k,l]=x.split(':');return `<button class="${S.artState===k?'on':''}" data-art-state="${k}">${l}</button>`;}).join('')}</span>`;
  let inner;
  if(S.artState==='loading') inner=`<div class="loading"><span class="spinner"></span><div>加载中…</div></div>`;
  else if(S.artState==='error') inner=`<div style="padding:22px"><div class="errbox">✕ 拉取制品失败：网络 / 5xx。<button class="btn btn-ghost btn-sm" style="margin-left:auto" data-act="art-retry">重试</button></div></div>`;
  else if(S.artState==='empty' || !all.length) inner=`<div class="empty"><span class="big">📦</span>${S.comp} 还没有制品<div style="margin-top:8px" class="hint">运行构建 / 发布后，产物自动归档进制品库</div></div>`;
  else inner=`<table class="table">
    <thead><tr><th>版本包</th><th>构建时间</th><th>文件大小</th></tr></thead>
    <tbody>${all.map(a=>`<tr>
      <td><a class="link" style="font-weight:600" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name)}</a></td>
      <td class="mono">${a.builtAt}</td>
      <td class="mono">${a.size}</td>
    </tr>`).join('')}</tbody></table>`;
  return `${ARCHIVE_INFO}
    <div class="toolbar2"><span class="hint">组件级制品（uuid 作用域，只读）</span><div class="spacer"></div>${seg}</div>
    <div class="card flush">${inner}</div>`;
}
/* 制品库为只读展示：版本包 = 签名 URL 超链接；无上传 / 删除 / 下载弹窗逻辑（删除与清理由 GC + 过期策略处理）。 */

/* ---------- 权限（permissions / component_role_bindings） ---------- */
function pagePermissions(){
  const uuid=curUuid(), comp=compLabel(uuid);
  const binds=(PERMISSION_BINDINGS[comp]||[]).slice();
  const legend=`<div class="row" style="gap:10px;margin-bottom:16px">${COMP_ROLES.map(r=>`
    <div class="card" style="flex:1;padding:13px">
      <div class="row" style="gap:7px;margin-bottom:4px"><span class="chip">${r.key}</span><b style="font-size:13.5px">${r.label}</b></div>
      <div class="hint">${r.perms}</div>
    </div>`).join('')}</div>`;
  const inner=binds.length?`<table class="table">
    <thead><tr><th>主体</th><th>类型</th><th>角色</th><th>绑定人</th><th>绑定时间</th><th>操作</th></tr></thead>
    <tbody>${binds.map((b,i)=>`<tr>
      <td><b>${esc(b.subject)}</b>${b.owner?' <span class="chip">owner</span>':''}</td>
      <td>${b.subjectType==='group'?'组':'用户'}</td>
      <td><select class="input" style="width:auto" data-perm-role="${i}" ${b.owner?'disabled':''}>${COMP_ROLES.map(r=>`<option value="${r.key}" ${b.role===r.key?'selected':''}>${r.label}</option>`).join('')}</select></td>
      <td>${b.boundBy}</td><td class="mono">${b.boundAt}</td>
      <td>${b.owner?'<span class="hint">不可移除</span>':`<button class="link" style="color:var(--fail-fg)" data-act="perm-remove" data-i="${i}">移除</button>`}</td>
    </tr>`).join('')}</tbody></table>`
    :`<div class="empty"><span class="big">🔒</span>暂无成员绑定<div style="margin-top:12px"><button class="btn btn-primary" data-act="perm-add">＋ 添加成员 / 组</button></div></div>`;
  return `${legend}
    <div class="toolbar2"><span class="hint">组件级 RBAC（component_role_bindings）</span><div class="spacer"></div><button class="btn btn-primary btn-sm" data-act="perm-add">＋ 添加成员 / 组</button></div>
    <div class="card flush">${inner}</div>`;
}
function permAdd(){
  const comp=compLabel(curUuid());
  openModal(`<h3>添加成员 / 组</h3>
    <div class="mb">当前组件：<b class="mono">${comp}</b>。绑定写入 <span class="mono">component_role_bindings</span>。</div>
    <div class="field"><label>主体类型</label><select id="pa-type" class="input"><option value="user">用户</option><option value="group">组</option></select></div>
    <div class="field"><label>主体名</label><input id="pa-name" class="input" placeholder="例如：李四 / svc-a-dev" /></div>
    <div class="field"><label>角色</label><select id="pa-role" class="input">${COMP_ROLES.map(r=>`<option value="${r.key}">${r.label}（${r.key}）</option>`).join('')}</select></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" data-ok>绑定</button></div>`,
    ()=>{ const name=document.getElementById('pa-name').value.trim(); if(!name){ toast('请填写主体名', true); return; }
      const type=document.getElementById('pa-type').value, role=document.getElementById('pa-role').value;
      const now=new Date(), pad=n=>String(n).padStart(2,'0'); const at=`${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
      (PERMISSION_BINDINGS[comp]=PERMISSION_BINDINGS[comp]||[]).push({subject:name, subjectType:type, role, boundBy:'张三', boundAt:at, owner:false});
      toast('已绑定 '+name+' → '+role); });
}
function permRemove(i){
  const comp=compLabel(curUuid()); const b=(PERMISSION_BINDINGS[comp]||[])[i]; if(!b) return;
  openModal(`<h3>移除绑定「${esc(b.subject)}」？</h3>
    <div class="mb">取消该主体在 <b class="mono">${comp}</b> 的 <span class="mono">${b.role}</span> 角色。需 <span class="mono">component:manage</span>（组件管理员）权限。</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" data-ok>确认移除</button></div>`,
    ()=>{ PERMISSION_BINDINGS[comp].splice(i,1); toast('已移除绑定「'+b.subject+'」（示意）'); });
}

/* ---------- 日志（logs / 运行日志聚合） ---------- */
function pageLogs(){
  const uuid=curUuid(), comp=compLabel(uuid);
  const runs=(RUN_LOGS[comp]||[]);
  if(!UI.logRun && runs[0]) UI.logRun=runs[0].id;
  const run=runs.find(r=>r.id===UI.logRun)||runs[0]||null;
  const seg=`<span class="seg">${['success:有效','empty:空态','loading:加载中','error:错误'].map(x=>{const[k,l]=x.split(':');return `<button class="${S.logState===k?'on':''}" data-log-state="${k}">${l}</button>`;}).join('')}</span>`;
  let panel;
  if(S.logState==='loading') panel=`<div class="loading"><span class="spinner"></span><div>连接日志流…</div></div>`;
  else if(S.logState==='error') panel=`<div style="padding:22px"><div class="errbox">✕ 日志拉取失败（GET /runs/:id/tasks/:name/log）。<button class="btn btn-ghost btn-sm" style="margin-left:auto" data-act="log-retry">重试</button></div></div>`;
  else if(S.logState==='empty' || !run) panel=`<div class="empty"><span class="big">⌛</span>等待输出<div class="hint">运行开始后日志将在此实时追加</div></div>`;
  else {
    const lines=[]; run.tasks.forEach(t=>t.lines.forEach(l=>lines.push(Object.assign({task:t.name}, l))));
    const filtered=lines.filter(l=>
      (UI.logLevel==='all'||l.level===UI.logLevel) &&
      (!UI.logQ || (l.msg+' '+l.task).toLowerCase().includes(UI.logQ.toLowerCase()))
    );
    panel=`<div class="code-block mono" style="max-height:540px">${
      filtered.length?filtered.map(l=>`<div style="color:${logColor(l.level)}"><span style="color:var(--text-sub)">${l.ts}</span> <b>[${l.level.toUpperCase()}]</b> <span style="color:var(--text-sub)">${esc(l.task)}</span> ${esc(l.msg)}</div>`).join('')
      :'<div style="color:var(--text-sub)">无匹配日志</div>'}</div>`;
  }
  return `<div class="toolbar2">
      <span class="hint">运行：</span>
      <select class="input" style="width:auto" data-sel="logRun">${runs.map(r=>`<option value="${r.id}" ${UI.logRun===r.id?'selected':''}>${r.pipeline} · ${r.id} · ${r.phase}</option>`).join('')}</select>
      <select class="input" style="width:auto" data-sel="logLevel"><option value="all">全部级别</option><option value="info">info</option><option value="warn">warn</option><option value="error">error</option></select>
      <input id="logQ" class="input" style="width:200px" placeholder="搜索日志…" value="${esc(UI.logQ)}" />
      <button class="btn btn-ghost btn-sm" data-act="log-search">搜索</button>
      <div class="spacer"></div>${seg}<button class="btn btn-ghost btn-sm" data-act="log-refresh">刷新</button>
    </div>
    <div class="card flush" style="padding:0">${panel}</div>`;
}
function logColor(l){ return l==='error'?'var(--fail-fg)':l==='warn'?'var(--warn-fg)':'var(--text)'; }
function logRefresh(){ toast('已刷新日志（示意）'); }
</script>
